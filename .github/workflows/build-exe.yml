name: Build Windows x64 Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 取得專案原始碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 PHP 8.2
      #    只用來建立 Phar
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          ini-values: phar.readonly=0

      # 3. 載入 Visual Studio 2022 編譯環境
      #    windows-latest 已內建 VS2022
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. 下載 Static PHP CLI v2
      - name: Download Static PHP CLI
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-windows-x64.exe" `
            -OutFile "spc.exe"

          if (-not (Test-Path "spc.exe")) {
            Write-Error "Failed to download spc.exe"
            exit 1
          }

          Write-Host "Static PHP CLI version:"
          .\spc.exe --version

      # 5. 下載 PHP 8.2、micro、mbstring、phar 的建置資源
      #
      # 這裡只使用 v2.8.6 help 中確認存在的 --with-php。
      # 不使用 --prefer-binary / --prefer-pre-built。
      - name: Download Static PHP build resources
        shell: pwsh
        run: |
          .\spc.exe download `
            "php,micro" `
            --with-php=8.2

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to download PHP/micro resources."
            exit 1
          }

          .\spc.exe download `
            --for-extensions="mbstring,phar" `
            --with-php=8.2

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to download mbstring/phar resources."
            exit 1
          }

      # 6. 建立 Windows x64 micro.sfx
      #
      # v2.8.6 的 build help 確認有：
      #   --build-micro
      #   --vs-ver
      #
      # 沒有 --with-php，所以不放在這裡。
      - name: Build Windows x64 micro.sfx
        shell: pwsh
        run: |
          .\spc.exe build `
            "mbstring,phar" `
            --build-micro `
            --vs-ver 2022

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Static PHP micro build failed."
            exit 1
          }

          if (-not (Test-Path "buildroot/bin/micro.sfx")) {
            Write-Error "micro.sfx was not created."
            exit 1
          }

          Copy-Item `
            "buildroot/bin/micro.sfx" `
            "micro.sfx" `
            -Force

          Write-Host "micro.sfx created successfully."
          Write-Host "Size: $((Get-Item 'micro.sfx').Length) bytes"

      # 7. 建立 Phar 打包程式
      - name: Create Phar builder
        shell: pwsh
        run: |
          @'
          <?php

          if ($argc < 2) {
              fwrite(
                  STDERR,
                  "Usage: php build_phar.php SCRIPT_NAME" . PHP_EOL
              );
              exit(1);
          }

          $script = $argv[1];

          $entryFile = __DIR__
              . DIRECTORY_SEPARATOR
              . $script
              . '.php';

          $pharFile = __DIR__
              . DIRECTORY_SEPARATOR
              . $script
              . '.phar';

          if (!file_exists($entryFile)) {
              fwrite(
                  STDERR,
                  "Entry script not found: {$entryFile}" . PHP_EOL
              );
              exit(1);
          }

          if (file_exists($pharFile)) {
              unlink($pharFile);
          }

          $phar = new Phar(
              $pharFile,
              0,
              $script . '.phar'
          );

          $phar->startBuffering();

          /*
           * 將專案內所有 PHP 原始碼加入 Phar。
           *
           * 包含：
           *   class_loader.php
           *   Helper/
           *   Ws2/
           *   各工具主程式
           *
           * 排除：
           *   build_phar.php
           *   已存在的 Phar
           */

          $directory = new RecursiveDirectoryIterator(
              __DIR__,
              FilesystemIterator::SKIP_DOTS
          );

          $iterator = new RecursiveIteratorIterator($directory);

          foreach ($iterator as $file) {
              if (!$file->isFile()) {
                  continue;
              }

              $path = $file->getPathname();

              if (!str_ends_with(
                  strtolower($path),
                  '.php'
              )) {
                  continue;
              }

              if (basename($path) === 'build_phar.php') {
                  continue;
              }

              $relative = substr(
                  $path,
                  strlen(__DIR__) + 1
              );

              $phar->addFile(
                  $path,
                  str_replace('\\', '/', $relative)
              );
          }

          /*
           * 將目前工具的主程式設定成 Phar 入口。
           */
          $phar->setStub(
              $phar->createDefaultStub(
                  $script . '.php'
              )
          );

          $phar->stopBuffering();

          echo "Created {$pharFile}" . PHP_EOL;
          '@ | Set-Content `
                -Path "build_phar.php" `
                -Encoding UTF8

          php -l build_phar.php

          if ($LASTEXITCODE -ne 0) {
            Write-Error "build_phar.php syntax check failed."
            exit 1
          }

      # 8. 建立所有獨立 EXE
      - name: Build executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Building $script.exe"
            Write-Host "========================================"

            if (Test-Path "$script.phar") {
              Remove-Item "$script.phar" -Force
            }

            if (Test-Path "$script.exe") {
              Remove-Item "$script.exe" -Force
            }

            # 建立 Phar
            php build_phar.php $script

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to build $script.phar"
              exit 1
            }

            if (-not (Test-Path "$script.phar")) {
              Write-Error "$script.phar was not created."
              exit 1
            }

            Write-Host "$script.phar created."
            Write-Host "Phar size: $((Get-Item "$script.phar").Length) bytes"

            # 合併 micro.sfx + Phar
            cmd /c "copy /b micro.sfx + $script.phar $script.exe"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to combine micro.sfx and $script.phar"
              exit 1
            }

            if (-not (Test-Path "$script.exe")) {
              Write-Error "$script.exe was not created."
              exit 1
            }

            Write-Host "$script.exe created successfully."
            Write-Host "EXE size: $((Get-Item "$script.exe").Length) bytes"
          }

      # 9. 啟動測試
      #
      # 不要求 CLI 回傳 0，因為沒有參數時工具本身可能正常回傳 1。
      # 只要不是 PHP / EXE 啟動失敗即可。
      - name: Smoke test executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            Write-Host ""
            Write-Host "Testing $script.exe ..."

            & ".\$script.exe" 2>&1 | Out-Host

            $exitCode = $LASTEXITCODE

            Write-Host "Exit code: $exitCode"

            # 0 = 正常
            # 1 = 通常是缺少命令列參數
            # 其他值視為啟動失敗
            if ($exitCode -ne 0 -and $exitCode -ne 1) {
              Write-Error "$script.exe failed to start. Exit code: $exitCode"
              exit 1
            }
          }

      # 10. 最終檔案確認
      - name: Verify executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            $exe = "$script.exe"

            if (-not (Test-Path $exe)) {
              Write-Error "Missing $exe"
              exit 1
            }

            $size = (Get-Item $exe).Length

            if ($size -le 0) {
              Write-Error "$exe is empty"
              exit 1
            }

            Write-Host "[OK] $exe - $size bytes"
          }

      # 11. 上傳最終 EXE
      - name: Upload Windows x64 executables
        uses: actions/upload-artifact@v4
        with:
          name: advhd_ws2_tools_win64
          path: |
            ws2_decompile.exe
            ws2_compile.exe
            arc_pack.exe
            pna_merge.exe
            ws2_validate.exe
          if-no-files-found: error
