name: Build Windows x64 Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # 必須使用 Windows 2022。
    # static-php-cli v2.8.5 只支援 VS2019 / VS2022。
    # 不要使用 windows-latest，因目前可能是 VS18。
    runs-on: windows-2022

    steps:
      # 1. 取得專案原始碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 PHP 8.2
      #    僅供建立 Phar 使用
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          ini-values: phar.readonly=0
          coverage: none

      # 3. 載入 VS2022 x64 編譯環境
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. 下載固定版本的 Static PHP CLI 2.8.5
      - name: Download Static PHP CLI 2.8.5
        shell: pwsh
        run: |
          $url = "https://github.com/crazywhalecc/static-php-cli/releases/download/2.8.5/spc-windows-x64.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "spc.exe"

          if (-not (Test-Path "spc.exe")) {
            Write-Error "Failed to download spc.exe"
            exit 1
          }

          Write-Host "Static PHP CLI:"
          .\spc.exe --version

      # 5. 確認目前真的使用 VS2022
      - name: Verify Visual Studio 2022
        shell: pwsh
        run: |
          Write-Host "VisualStudioVersion = $env:VisualStudioVersion"
          Write-Host "VSINSTALLDIR = $env:VSINSTALLDIR"
          Write-Host "VCToolsVersion = $env:VCToolsVersion"

          if ($env:VisualStudioVersion -notlike "17.*") {
            Write-Error "This workflow requires Visual Studio 2022 (VS17)."
            exit 1
          }

      # 6. 檢查 / 自動準備 static-php-cli 建置環境
      #
      # Windows 2022 有 VS2022，因此這裡不應再出現
      # "Visual Studio not installed".
      - name: Prepare Static PHP build environment
        shell: pwsh
        run: |
          .\spc.exe doctor --auto-fix

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Static PHP CLI environment preparation failed."
            exit 1
          }

      # 7. 下載 PHP 8.2 + micro + mbstring + phar
      #
      # 注意：
      # v2.8.5 的 --with-php 是 download 選項。
      # 不使用 --prefer-binary。
      # 不使用 --prefer-pre-built。
      - name: Download PHP build resources
        shell: pwsh
        run: |
          .\spc.exe download `
            --with-php=8.2 `
            --for-extensions="mbstring,phar"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to download PHP build resources."
            exit 1
          }

      # 8. 建立 Windows x64 micro.sfx
      #
      # v2.8.5 build 正確形式：
      #   spc build "mbstring,phar" --build-micro
      #
      # 不使用 --with-php。
      - name: Build Windows x64 micro.sfx
        shell: pwsh
        run: |
          .\spc.exe build `
            "mbstring,phar" `
            --build-micro

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Static PHP micro build failed."
            exit 1
          }

          $microPath = "buildroot/bin/micro.sfx"

          if (-not (Test-Path $microPath)) {
            Write-Error "micro.sfx was not created."
            exit 1
          }

          Copy-Item `
            $microPath `
            "micro.sfx" `
            -Force

          $size = (Get-Item "micro.sfx").Length

          Write-Host "micro.sfx created successfully."
          Write-Host "Size: $size bytes"

      # 9. 建立 Phar Builder
      - name: Create Phar builder
        shell: pwsh
        run: |
          @'
          <?php

          if ($argc < 2) {
              fwrite(
                  STDERR,
                  "Usage: php build_phar.php SCRIPT_NAME" . PHP_EOL
              );
              exit(1);
          }

          $script = $argv[1];

          $entryFile = __DIR__
              . DIRECTORY_SEPARATOR
              . $script
              . '.php';

          $pharFile = __DIR__
              . DIRECTORY_SEPARATOR
              . $script
              . '.phar';

          if (!file_exists($entryFile)) {
              fwrite(
                  STDERR,
                  "Entry script not found: {$entryFile}" . PHP_EOL
              );
              exit(1);
          }

          if (file_exists($pharFile)) {
              unlink($pharFile);
          }

          $phar = new Phar(
              $pharFile,
              0,
              $script . '.phar'
          );

          $phar->startBuffering();

          /*
           * 將專案中的所有 PHP 原始碼加入 Phar。
           *
           * 包含：
           *   class_loader.php
           *   Helper/
           *   Ws2/
           *   各工具主程式
           *
           * 排除：
           *   build_phar.php
           *   已建立的 .phar
           */

          $directory = new RecursiveDirectoryIterator(
              __DIR__,
              FilesystemIterator::SKIP_DOTS
          );

          $iterator = new RecursiveIteratorIterator($directory);

          foreach ($iterator as $file) {

              if (!$file->isFile()) {
                  continue;
              }

              $path = $file->getPathname();

              if (!str_ends_with(
                  strtolower($path),
                  '.php'
              )) {
                  continue;
              }

              if (basename($path) === 'build_phar.php') {
                  continue;
              }

              $relative = substr(
                  $path,
                  strlen(__DIR__) + 1
              );

              $phar->addFile(
                  $path,
                  str_replace('\\', '/', $relative)
              );
          }

          /*
           * 使用目前工具的主程式作為 Phar 入口。
           */
          $phar->setStub(
              $phar->createDefaultStub(
                  $script . '.php'
              )
          );

          $phar->stopBuffering();

          echo "Created {$pharFile}" . PHP_EOL;
          '@ | Set-Content `
                -Path "build_phar.php" `
                -Encoding UTF8

          php -l build_phar.php

          if ($LASTEXITCODE -ne 0) {
            Write-Error "build_phar.php syntax check failed."
            exit 1
          }

      # 10. 建立五個獨立 EXE
      - name: Build executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Building $script.exe"
            Write-Host "========================================"

            if (Test-Path "$script.phar") {
              Remove-Item "$script.phar" -Force
            }

            if (Test-Path "$script.exe") {
              Remove-Item "$script.exe" -Force
            }

            # 建立 Phar
            php build_phar.php $script

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create $script.phar"
              exit 1
            }

            if (-not (Test-Path "$script.phar")) {
              Write-Error "$script.phar was not created."
              exit 1
            }

            Write-Host "$script.phar created."
            Write-Host "Phar size: $((Get-Item "$script.phar").Length) bytes"

            # 合併 micro.sfx + Phar
            cmd /c "copy /b micro.sfx + $script.phar $script.exe"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to combine micro.sfx and $script.phar"
              exit 1
            }

            if (-not (Test-Path "$script.exe")) {
              Write-Error "$script.exe was not created."
              exit 1
            }

            Write-Host "$script.exe created successfully."
            Write-Host "EXE size: $((Get-Item "$script.exe").Length) bytes"
          }

      # 11. 基本驗證
      - name: Verify executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            $exe = "$script.exe"

            if (-not (Test-Path $exe)) {
              Write-Error "Missing $exe"
              exit 1
            }

            $size = (Get-Item $exe).Length

            if ($size -le 0) {
              Write-Error "$exe is empty"
              exit 1
            }

            Write-Host "[OK] $exe - $size bytes"
          }

      # 12. 上傳成品
      - name: Upload Windows x64 executables
        uses: actions/upload-artifact@v4
        with:
          name: advhd_ws2_tools_win64
          path: |
            ws2_decompile.exe
            ws2_compile.exe
            arc_pack.exe
            pna_merge.exe
            ws2_validate.exe
          if-no-files-found: error
