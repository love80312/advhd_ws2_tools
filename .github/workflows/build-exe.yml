name: Build Windows x64 Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # static-php-cli v2.8.5 的 Windows builder
    # 只支援 VS2019 / VS2022。
    runs-on: windows-2022

    steps:
      # 1. 取得專案原始碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 PHP 8.2
      #    只存在 GitHub Actions runner，
      #    最終 EXE 不需要 PHP。
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          ini-values: phar.readonly=0
          coverage: none

      # 3. 載入 VS2022 x64 編譯環境
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. 下載固定版本 Static PHP CLI
      - name: Download Static PHP CLI 2.8.5
        shell: pwsh
        run: |
          $url = "https://github.com/crazywhalecc/static-php-cli/releases/download/2.8.5/spc-windows-x64.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "spc.exe"

          if (-not (Test-Path "spc.exe")) {
            Write-Error "Failed to download spc.exe"
            exit 1
          }

          Write-Host "Static PHP CLI version:"
          .\spc.exe --version

      # 5. 確認 VS2022
      - name: Verify Visual Studio 2022
        shell: pwsh
        run: |
          Write-Host "VisualStudioVersion = $env:VisualStudioVersion"
          Write-Host "VCToolsVersion      = $env:VCToolsVersion"
          Write-Host "VSINSTALLDIR        = $env:VSINSTALLDIR"

          if ($env:VisualStudioVersion -notlike "17.*") {
            Write-Error "Visual Studio 2022 is required."
            exit 1
          }

      # 6. 準備 Static PHP 建置環境
      - name: Prepare Static PHP environment
        shell: pwsh
        run: |
          .\spc.exe doctor --auto-fix

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Static PHP environment preparation failed."
            exit 1
          }

      # 7. 下載 PHP 8.2 + micro + mbstring + phar
      - name: Download PHP build resources
        shell: pwsh
        run: |
          .\spc.exe download `
            --with-php=8.2 `
            --for-extensions="mbstring,phar"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to download PHP build resources."
            exit 1
          }

      # 8. 編譯 Windows x64 micro.sfx
      #
      # 這裡使用你已經成功的 v2.8.5 語法。
      - name: Build Windows x64 micro.sfx
        shell: pwsh
        run: |
          .\spc.exe build `
            "mbstring,phar" `
            --build-micro

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Static PHP micro build failed."
            exit 1
          }

          $microPath = "buildroot/bin/micro.sfx"

          if (-not (Test-Path $microPath)) {
            Write-Error "micro.sfx was not created."
            exit 1
          }

          Copy-Item `
            $microPath `
            "micro.sfx" `
            -Force

          Write-Host "micro.sfx created successfully."
          Write-Host "Size: $((Get-Item 'micro.sfx').Length) bytes"

      # 9. 建立 Phar Builder
      - name: Create Phar builder
        shell: pwsh
        run: |
          @'
          <?php

          if ($argc < 2) {
              fwrite(
                  STDERR,
                  "Usage: php build_phar.php SCRIPT_NAME" . PHP_EOL
              );
              exit(1);
          }

          $script = $argv[1];

          $entryFile = __DIR__
              . DIRECTORY_SEPARATOR
              . $script
              . '.php';

          $pharFile = __DIR__
              . DIRECTORY_SEPARATOR
              . $script
              . '.phar';

          if (!file_exists($entryFile)) {
              fwrite(
                  STDERR,
                  "Entry script not found: {$entryFile}" . PHP_EOL
              );
              exit(1);
          }

          if (file_exists($pharFile)) {
              unlink($pharFile);
          }

          $phar = new Phar(
              $pharFile,
              0,
              $script . '.phar'
          );

          $phar->startBuffering();

          /*
           * 將專案所有 PHP 原始碼加入 Phar。
           *
           * 包含：
           *   class_loader.php
           *   Helper/
           *   Ws2/
           *   各工具主程式
           *
           * 排除：
           *   build_phar.php
           *   *.phar
           */

          $directory = new RecursiveDirectoryIterator(
              __DIR__,
              FilesystemIterator::SKIP_DOTS
          );

          $iterator = new RecursiveIteratorIterator($directory);

          foreach ($iterator as $file) {

              if (!$file->isFile()) {
                  continue;
              }

              $path = $file->getPathname();

              if (!str_ends_with(
                  strtolower($path),
                  '.php'
              )) {
                  continue;
              }

              if (basename($path) === 'build_phar.php') {
                  continue;
              }

              $relative = substr(
                  $path,
                  strlen(__DIR__) + 1
              );

              $phar->addFile(
                  $path,
                  str_replace('\\', '/', $relative)
              );
          }

          /*
           * 使用目前工具的主 PHP 程式當作 Phar 入口。
           */
          $phar->setStub(
              $phar->createDefaultStub(
                  $script . '.php'
              )
          );

          $phar->stopBuffering();

          echo "Created {$pharFile}" . PHP_EOL;
          '@ | Set-Content `
                -Path "build_phar.php" `
                -Encoding UTF8

          php -l build_phar.php

          if ($LASTEXITCODE -ne 0) {
            Write-Error "build_phar.php syntax check failed."
            exit 1
          }

      # 10. 建立 EXE
      #
      # 重要：
      # 不再使用：
      #   copy /b micro.sfx + xxx.phar xxx.exe
      #
      # 改用 Static PHP 官方 micro:combine。
      - name: Build executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Building $script.exe"
            Write-Host "========================================"

            if (Test-Path "$script.phar") {
              Remove-Item "$script.phar" -Force
            }

            if (Test-Path "$script.exe") {
              Remove-Item "$script.exe" -Force
            }

            # 建立 Phar
            php build_phar.php $script

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create $script.phar"
              exit 1
            }

            if (-not (Test-Path "$script.phar")) {
              Write-Error "$script.phar was not created."
              exit 1
            }

            Write-Host "$script.phar created."
            Write-Host "Phar size: $((Get-Item "$script.phar").Length) bytes"

            # 使用官方 micro:combine
            .\spc.exe micro:combine `
              "$script.phar" `
              -O "$script.exe"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "micro:combine failed for $script.phar"
              exit 1
            }

            if (-not (Test-Path "$script.exe")) {
              Write-Error "$script.exe was not created."
              exit 1
            }

            Write-Host "$script.exe created successfully."
            Write-Host "EXE size: $((Get-Item "$script.exe").Length) bytes"
          }

      # 11. 測試命令列參數是否真的傳入 EXE
      #
      # 建立一個空資料夾。
      # ws2_decompile.php 只要收到正確的第一個參數，
      # 就不應該顯示 Usage。
      - name: Test command line arguments
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "ws2-test"

          if (Test-Path $testDir) {
            Remove-Item $testDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $testDir `
            -Force | Out-Null

          Write-Host "Testing ws2_decompile.exe"
          Write-Host "Test directory: $testDir"

          $output = & ".\ws2_decompile.exe" "$testDir" "1.06" 2>&1

          $exitCode = $LASTEXITCODE

          $output | ForEach-Object {
            Write-Host $_
          }

          Write-Host "Exit code: $exitCode"

          $text = ($output | Out-String)

          # 若參數沒有傳入，程式會進入這段 Usage。
          if ($text -match "Usage: php ws2_decompile\.php") {
            Write-Error `
              "Command line arguments were not passed correctly to the bundled PHP application."
            exit 1
          }

          Write-Host "Command line argument test passed."

      # 12. 確認全部 EXE
      - name: Verify executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            $exe = "$script.exe"

            if (-not (Test-Path $exe)) {
              Write-Error "Missing $exe"
              exit 1
            }

            $size = (Get-Item $exe).Length

            if ($size -le 0) {
              Write-Error "$exe is empty"
              exit 1
            }

            Write-Host "[OK] $exe - $size bytes"
          }

      # 13. 上傳最終 Windows x64 EXE
      - name: Upload Windows x64 executables
        uses: actions/upload-artifact@v4
        with:
          name: advhd_ws2_tools_win64
          path: |
            ws2_decompile.exe
            ws2_compile.exe
            arc_pack.exe
            pna_merge.exe
            ws2_validate.exe
          if-no-files-found: error
