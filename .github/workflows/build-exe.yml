name: Build Windows x64 Phar Tools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          ini-values: phar.readonly=0
          extensions: mbstring

      - name: Create build script
        run: |
          $buildScript = @'
          <?php
          $scripts = ["ws2_decompile", "ws2_compile", "arc_pack", "pna_merge", "ws2_validate"];
          
          foreach ($scripts as $script) {
              $pharFile = $script . '.phar';
              if (file_exists($pharFile)) {
                  unlink($pharFile);
              }
              
              echo "Building {$pharFile}...\n";
              $phar = new Phar($pharFile);
              $phar->startBuffering();
              $phar->buildFromDirectory(__DIR__, '/\.php$/');
              $stub = "#!/usr/bin/env php\n" . $phar->createDefaultStub($script . '.php');
              $phar->setStub($stub);
              $phar->stopBuffering();
              echo "Successfully built {$pharFile}\n";
          }
          '@
          Set-Content -Path "make_phar.php" -Value $buildScript

      - name: Run Phar Builder
        run: php make_phar.php

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: advhd_ws2_tools_phar
          path: '*.phar'
