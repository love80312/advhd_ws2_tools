name: Build Windows x64 Phar Tools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          ini-values: phar.readonly=0
          extensions: mbstring

      - name: Build Phar files for each tool
        run: |
          $scripts = @("ws2_decompile", "ws2_compile", "arc_pack", "pna_merge", "ws2_validate")
          
          foreach ($script in $scripts) {
            Write-Host "Building ${script}.phar..."
            $pharFile = "${script}.phar"
            if (test-path $pharFile) { remove-item $pharFile }
            
            $phar = new Phar($pharFile, 0, $pharFile)
            $phar->startBuffering()
            
            # 將專案內所有 .php 檔案與資料夾加入
            $phar->buildFromDirectory("$PSScriptRoot", '/\.php$/')
            
            # 設定執行進入點
            $stub = "#!/usr/bin/env php" + "`n" + $phar->createDefaultStub("${script}.php")
            $phar->setStub($stub)
            $phar->stopBuffering()
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: advhd_ws2_tools_phar
          path: '*.phar'
