name: Build Windows x64 Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # Static PHP CLI v2.8.5 的 Windows builder 需要 VS2019/2022
    runs-on: windows-2022

    steps:
      # 1. 取得原始碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. PHP 8.2 僅存在 GitHub Actions runner
      #    最終 EXE 不需要安裝 PHP
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          ini-values: phar.readonly=0
          coverage: none

      # 3. 載入 VS2022 x64 編譯環境
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. 固定使用 Static PHP CLI 2.8.5
      - name: Download Static PHP CLI 2.8.5
        shell: pwsh
        run: |
          $url = "https://github.com/crazywhalecc/static-php-cli/releases/download/2.8.5/spc-windows-x64.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "spc.exe"

          if (-not (Test-Path "spc.exe")) {
            Write-Error "Failed to download spc.exe"
            exit 1
          }

          Write-Host "Static PHP CLI version:"
          .\spc.exe --version

      # 5. 確認 VS2022
      - name: Verify Visual Studio 2022
        shell: pwsh
        run: |
          Write-Host "VisualStudioVersion = $env:VisualStudioVersion"
          Write-Host "VCToolsVersion      = $env:VCToolsVersion"
          Write-Host "VSINSTALLDIR        = $env:VSINSTALLDIR"

          if ($env:VisualStudioVersion -notlike "17.*") {
            Write-Error "Visual Studio 2022 is required."
            exit 1
          }

      # 6. 準備 Static PHP 建置環境
      - name: Prepare Static PHP environment
        shell: pwsh
        run: |
          .\spc.exe doctor --auto-fix

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Static PHP environment preparation failed."
            exit 1
          }

      # 7. 下載 PHP 8.2 + mbstring + phar
      - name: Download PHP build resources
        shell: pwsh
        run: |
          .\spc.exe download `
            --with-php=8.2 `
            --for-extensions="mbstring,phar"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to download PHP build resources."
            exit 1
          }

      # 8. 編譯 Windows x64 micro.sfx
      - name: Build Windows x64 micro.sfx
        shell: pwsh
        run: |
          .\spc.exe build `
            "mbstring,phar" `
            --build-micro

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Static PHP micro build failed."
            exit 1
          }

          $microPath = "buildroot/bin/micro.sfx"

          if (-not (Test-Path $microPath)) {
            Write-Error "micro.sfx was not created."
            exit 1
          }

          Copy-Item `
            $microPath `
            "micro.sfx" `
            -Force

          Write-Host "micro.sfx created successfully."
          Write-Host "Size: $((Get-Item 'micro.sfx').Length) bytes"

      # 9. 修正 ws2_decompile.php 的 PHP 8.x 型別問題
      #
      # 原始程式：
      #   $options['encoding'] 預設為 null
      #   new Ws2\Reader($options['encoding'])
      #
      # Reader::__construct() 要求 string。
      #
      # 只將 null 轉為空字串，不修改 Reader.php。
      - name: Fix ws2_decompile encoding
        shell: pwsh
        run: |
          $file = "ws2_decompile.php"

          if (-not (Test-Path $file)) {
            Write-Error "Cannot find $file"
            exit 1
          }

          $content = Get-Content `
            -Path $file `
            -Raw `
            -Encoding UTF8

          $old = 'new Ws2\Reader($options[''encoding'']);'
          $new = 'new Ws2\Reader($options[''encoding''] ?? '''');'

          if (-not $content.Contains($old)) {
            Write-Error "Expected Reader call was not found in ws2_decompile.php."
            exit 1
          }

          $content = $content.Replace($old, $new)

          Set-Content `
            -Path $file `
            -Value $content `
            -Encoding UTF8 `
            -NoNewline

          Write-Host "ws2_decompile.php patched successfully."

          php -l ws2_decompile.php

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ws2_decompile.php syntax check failed."
            exit 1
          }

      # 10. 建立 Phar Builder
      - name: Create Phar builder
        shell: pwsh
        run: |
          @'
          <?php

          if ($argc < 2) {
              fwrite(
                  STDERR,
                  "Usage: php build_phar.php SCRIPT_NAME" . PHP_EOL
              );
              exit(1);
          }

          $script = $argv[1];

          $entryFile = __DIR__
              . DIRECTORY_SEPARATOR
              . $script
              . '.php';

          $pharFile = __DIR__
              . DIRECTORY_SEPARATOR
              . $script
              . '.phar';

          if (!file_exists($entryFile)) {
              fwrite(
                  STDERR,
                  "Entry script not found: {$entryFile}" . PHP_EOL
              );
              exit(1);
          }

          if (file_exists($pharFile)) {
              unlink($pharFile);
          }

          $phar = new Phar(
              $pharFile,
              0,
              $script . '.phar'
          );

          $phar->startBuffering();

          /*
           * 將專案內所有 PHP 原始碼加入 Phar。
           *
           * 包含：
           *   class_loader.php
           *   Helper/
           *   Ws2/
           *   各工具主程式
           *
           * 排除：
           *   build_phar.php
           *   *.phar
           */

          $directory = new RecursiveDirectoryIterator(
              __DIR__,
              FilesystemIterator::SKIP_DOTS
          );

          $iterator = new RecursiveIteratorIterator($directory);

          foreach ($iterator as $file) {

              if (!$file->isFile()) {
                  continue;
              }

              $path = $file->getPathname();

              if (!str_ends_with(
                  strtolower($path),
                  '.php'
              )) {
                  continue;
              }

              if (basename($path) === 'build_phar.php') {
                  continue;
              }

              $relative = substr(
                  $path,
                  strlen(__DIR__) + 1
              );

              $phar->addFile(
                  $path,
                  str_replace('\\', '/', $relative)
              );
          }

          $phar->setStub(
              $phar->createDefaultStub(
                  $script . '.php'
              )
          );

          $phar->stopBuffering();

          echo "Created {$pharFile}" . PHP_EOL;
          '@ | Set-Content `
                -Path "build_phar.php" `
                -Encoding UTF8

          php -l build_phar.php

          if ($LASTEXITCODE -ne 0) {
            Write-Error "build_phar.php syntax check failed."
            exit 1
          }

      # 11. 建立 EXE
      - name: Build executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Building $script.exe"
            Write-Host "========================================"

            if (Test-Path "$script.phar") {
              Remove-Item "$script.phar" -Force
            }

            if (Test-Path "$script.exe") {
              Remove-Item "$script.exe" -Force
            }

            # 建立 Phar
            php build_phar.php $script

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create $script.phar"
              exit 1
            }

            if (-not (Test-Path "$script.phar")) {
              Write-Error "$script.phar was not created."
              exit 1
            }

            Write-Host "$script.phar created."
            Write-Host "Phar size: $((Get-Item "$script.phar").Length) bytes"

            # 使用 Static PHP 官方 micro:combine
            .\spc.exe micro:combine `
              "$script.phar" `
              -O "$script.exe"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "micro:combine failed for $script.phar"
              exit 1
            }

            if (-not (Test-Path "$script.exe")) {
              Write-Error "$script.exe was not created."
              exit 1
            }

            Write-Host "$script.exe created successfully."
            Write-Host "EXE size: $((Get-Item "$script.exe").Length) bytes"
          }

      # 12. 真正測試 ws2_decompile.exe
      #
      # 使用空資料夾 + 1.06。
      # 正常情況：
      #   不應出現 Fatal error
      #   不應出現 TypeError
      #   不應出現 Usage
      #
      # 空資料夾沒有 .ws2，所以程式正常結束即可。
      - name: Test ws2_decompile executable
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "ws2-test"

          if (Test-Path $testDir) {
            Remove-Item `
              $testDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $testDir `
            -Force | Out-Null

          Write-Host "Testing ws2_decompile.exe"
          Write-Host "Test directory: $testDir"

          $output = @(
            & ".\ws2_decompile.exe" "$testDir" "1.06" 2>&1
          )

          $exitCode = $LASTEXITCODE
          $text = $output -join "`n"

          $output | ForEach-Object {
            Write-Host $_
          }

          Write-Host "Exit code: $exitCode"

          if ($text -match "Fatal error:") {
            Write-Error "Fatal PHP error detected."
            exit 1
          }

          if ($text -match "TypeError:") {
            Write-Error "PHP TypeError detected."
            exit 1
          }

          if ($text -match "Uncaught") {
            Write-Error "Unhandled PHP exception detected."
            exit 1
          }

          if ($text -match "Parse error:") {
            Write-Error "PHP parse error detected."
            exit 1
          }

          if ($text -match "Usage: php ws2_decompile\.php") {
            Write-Error "Command line arguments were not accepted."
            exit 1
          }

          if ($exitCode -ne 0) {
            Write-Error "ws2_decompile.exe exited with code $exitCode."
            exit 1
          }

          Write-Host "ws2_decompile.exe test passed."

      # 13. 確認全部 EXE
      - name: Verify executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            $exe = "$script.exe"

            if (-not (Test-Path $exe)) {
              Write-Error "Missing $exe"
              exit 1
            }

            $size = (Get-Item $exe).Length

            if ($size -le 0) {
              Write-Error "$exe is empty"
              exit 1
            }

            Write-Host "[OK] $exe - $size bytes"
          }

      # 14. 上傳最終 EXE
      - name: Upload Windows x64 executables
        uses: actions/upload-artifact@v4
        with:
          name: advhd_ws2_tools_win64
          path: |
            ws2_decompile.exe
            ws2_compile.exe
            arc_pack.exe
            pna_merge.exe
            ws2_validate.exe
          if-no-files-found: error
