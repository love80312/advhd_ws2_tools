name: Build Windows x64 Executables

on:
  workflow_dispatch: # 允許在 GitHub 網頁上手動觸發

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          ini-values: phar.readonly=0

      - name: Download PHP micro.sfx
        run: |
          # 下載預先編譯好、包含 mbstring 擴充的 PHP 8.2 micro 核心
          Invoke-WebRequest -Uri "https://dl.static-php.dev/static-php-cli/bulk/php-8.2-micro-windows-x86_64.zip" -OutFile "micro.zip"
          Expand-Archive -Path "micro.zip" -DestinationPath "."

      - name: Build Phar and EXE for each tool
        run: |
          # 需要編譯的五個主要腳本
          $scripts = @("ws2_decompile", "ws2_compile", "arc_pack", "pna_merge", "ws2_validate")
          
          # 建立用來打包 Phar 的 PHP 腳本
          $pharBuilder = @"
          <?php
          `$script = `$argv[1];
          `$pharFile = `$script . '.phar';
          if (file_exists(`$pharFile)) unlink(`$pharFile);
          
          `$phar = new Phar(`$pharFile);
          // 遞迴加入目錄下所有的 .php 檔案
          `$phar->buildFromDirectory(__DIR__, '/\.php$/');
          // 設定程式進入點
          `$phar->setStub(`$phar->createDefaultStub(`$script . '.php'));
          "@
          Set-Content -Path "build_phar.php" -Value $pharBuilder

          # 依序打包並結合 micro.sfx 產生 .exe
          foreach ($script in $scripts) {
            Write-Host "Building ${script}.exe..."
            php build_phar.php $script
            # 將二進制檔案相加
            cmd /c "copy /b micro.sfx + ${script}.phar ${script}.exe"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: advhd_ws2_tools_win64
          path: '*.exe'
