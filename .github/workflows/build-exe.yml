name: Build Windows x64 Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 取得原始碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安裝 PHP 8.2
      #    僅用來建立 Phar
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          ini-values: phar.readonly=0

      # 3. 下載 Static PHP CLI
      - name: Download Static PHP CLI
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-windows-x64.exe" `
            -OutFile "spc.exe"

          if (-not (Test-Path "spc.exe")) {
            Write-Error "Failed to download spc.exe"
            exit 1
          }

          Write-Host "Static PHP CLI version:"
          .\spc.exe --version

      # 4. 下載 PHP 8.2、micro、mbstring、phar 所需資源
      #    --with-php 只能放在 download
      - name: Download build resources
        shell: pwsh
        run: |
          .\spc.exe download `
            "php,micro" `
            --with-php=8.2 `
            --prefer-binary

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to download PHP/micro resources."
            exit 1
          }

          .\spc.exe download `
            --for-extensions="mbstring,phar" `
            --with-php=8.2 `
            --prefer-binary

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to download extension resources."
            exit 1
          }

      # 5. 建立 Windows x64 micro.sfx
      #
      # 注意：
      # v2.8.6 的 build 沒有 --with-php。
      # PHP 版本已在上面的 download 階段決定。
      - name: Build micro.sfx
        shell: pwsh
        run: |
          .\spc.exe build `
            "mbstring,phar" `
            --build-micro

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Static PHP micro build failed."
            exit 1
          }

          $micro = "buildroot/bin/micro.sfx"

          if (-not (Test-Path $micro)) {
            Write-Error "micro.sfx was not created."
            exit 1
          }

          Copy-Item `
            $micro `
            "micro.sfx" `
            -Force

          $size = (Get-Item "micro.sfx").Length

          Write-Host "micro.sfx created successfully."
          Write-Host "Size: $size bytes"

      # 6. 建立 Phar 打包程式
      - name: Create Phar builder
        shell: pwsh
        run: |
          @'
          <?php

          if ($argc < 2) {
              fwrite(
                  STDERR,
                  "Usage: php build_phar.php SCRIPT_NAME" . PHP_EOL
              );
              exit(1);
          }

          $script = $argv[1];

          $entryFile = __DIR__
              . DIRECTORY_SEPARATOR
              . $script
              . '.php';

          $pharFile = __DIR__
              . DIRECTORY_SEPARATOR
              . $script
              . '.phar';

          if (!file_exists($entryFile)) {
              fwrite(
                  STDERR,
                  "Entry script not found: {$entryFile}" . PHP_EOL
              );
              exit(1);
          }

          if (file_exists($pharFile)) {
              unlink($pharFile);
          }

          $phar = new Phar(
              $pharFile,
              0,
              $script . '.phar'
          );

          $phar->startBuffering();

          /*
           * 將專案中的 PHP 原始碼全部加入 Phar。
           *
           * 包含：
           *   Ws2/
           *   Helper/
           *   class_loader.php
           *   各工具主程式
           *
           * 排除：
           *   build_phar.php
           *   *.phar
           */

          $directory = new RecursiveDirectoryIterator(
              __DIR__,
              FilesystemIterator::SKIP_DOTS
          );

          $iterator = new RecursiveIteratorIterator($directory);

          foreach ($iterator as $file) {

              if (!$file->isFile()) {
                  continue;
              }

              $path = $file->getPathname();

              if (!str_ends_with(
                  strtolower($path),
                  '.php'
              )) {
                  continue;
              }

              $basename = basename($path);

              if ($basename === 'build_phar.php') {
                  continue;
              }

              $relative = substr(
                  $path,
                  strlen(__DIR__) + 1
              );

              $phar->addFile(
                  $path,
                  str_replace('\\', '/', $relative)
              );
          }

          /*
           * 設定目前工具的主 PHP 程式為 Phar 入口。
           */
          $phar->setStub(
              $phar->createDefaultStub(
                  $script . '.php'
              )
          );

          $phar->stopBuffering();

          echo "Created {$pharFile}" . PHP_EOL;
          '@ | Set-Content `
                -Path "build_phar.php" `
                -Encoding UTF8

          php -l build_phar.php

          if ($LASTEXITCODE -ne 0) {
            Write-Error "build_phar.php syntax check failed."
            exit 1
          }

      # 7. 建立獨立 EXE
      - name: Build executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Building $script.exe"
            Write-Host "========================================"

            if (Test-Path "$script.phar") {
              Remove-Item "$script.phar" -Force
            }

            if (Test-Path "$script.exe") {
              Remove-Item "$script.exe" -Force
            }

            # 建立 Phar
            php build_phar.php $script

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create $script.phar"
              exit 1
            }

            if (-not (Test-Path "$script.phar")) {
              Write-Error "$script.phar was not created."
              exit 1
            }

            $pharSize = (Get-Item "$script.phar").Length

            Write-Host "$script.phar created."
            Write-Host "Phar size: $pharSize bytes"

            # micro.sfx + Phar
            cmd /c "copy /b micro.sfx + $script.phar $script.exe"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to combine micro.sfx and $script.phar"
              exit 1
            }

            if (-not (Test-Path "$script.exe")) {
              Write-Error "$script.exe was not created."
              exit 1
            }

            $exeSize = (Get-Item "$script.exe").Length

            Write-Host "$script.exe created successfully."
            Write-Host "EXE size: $exeSize bytes"
          }

      # 8. 驗證 EXE
      - name: Verify executables
        shell: pwsh
        run: |
          $scripts = @(
            "ws2_decompile",
            "ws2_compile",
            "arc_pack",
            "pna_merge",
            "ws2_validate"
          )

          foreach ($script in $scripts) {

            $exe = "$script.exe"

            if (-not (Test-Path $exe)) {
              Write-Error "Missing $exe"
              exit 1
            }

            $size = (Get-Item $exe).Length

            if ($size -le 0) {
              Write-Error "$exe is empty"
              exit 1
            }

            Write-Host "[OK] $exe - $size bytes"
          }

      # 9. 上傳 Artifacts
      - name: Upload Windows x64 executables
        uses: actions/upload-artifact@v4
        with:
          name: advhd_ws2_tools_win64
          path: |
            ws2_decompile.exe
            ws2_compile.exe
            arc_pack.exe
            pna_merge.exe
            ws2_validate.exe
          if-no-files-found: error
